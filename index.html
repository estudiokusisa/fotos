<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería de fotos</title>
<style>
  :root { --principal:#999999; --fondo:#ffffff; --texto:#333333; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--fondo); color: var(--texto);
    min-height: 100vh; display:flex; flex-direction:column;
  }
  header { text-align:center; padding:28px 20px 10px; }
  h1 { font-family: var(--fuente, Georgia, 'Times New Roman', serif); font-size:clamp(1.9rem,7vw,3.2rem); font-weight:400; letter-spacing:.04em; }
  header p { font-family:system-ui,sans-serif; opacity:.75; margin-top:6px; font-size:1rem; }
  .linea { width:60px; height:2px; background:var(--principal); margin:14px auto 0; border-radius:2px; }

  .tabs { display:flex; justify-content:center; gap:8px; padding:14px 16px 6px; font-family:system-ui,sans-serif; }
  .tab {
    border:1px solid var(--principal); background:transparent; color:var(--principal);
    padding:7px 18px; border-radius:999px; font-size:.9rem; cursor:pointer;
  }
  .tab.activa { background:var(--principal); color:#fff; }

  .escenario {
    position:relative; flex:1; min-height:55vh; margin:10px 16px 100px;
    border-radius:18px; overflow:hidden; background:rgba(0,0,0,.06);
  }
  .escenario img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity 1s ease;
  }
  .escenario img.visible { opacity:1; }
  .vacio {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; font-family:system-ui,sans-serif; opacity:.7;
  }

  .grilla {
    display:none; grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:8px; padding:6px 16px 100px;
  }
  .grilla img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; cursor:pointer; background:rgba(0,0,0,.06); }
  body.modo-grilla .grilla { display:grid; }
  body.modo-grilla .escenario { display:none; }

  .barra {
    position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--fondo) 70%, transparent); text-align:center;
  }
  .boton {
    font-family:system-ui,sans-serif; font-size:1.05rem; font-weight:600;
    background:var(--principal); color:#fff; border:none; border-radius:999px;
    padding:15px 34px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .boton:disabled { opacity:.6; cursor:default; }
  #aviso {
    font-family:system-ui,sans-serif; font-size:.92rem; margin-bottom:10px; min-height:1.2em;
  }
    #cargandoMsg { display:none; }
  body.cargando > *:not(#cargandoMsg) { visibility:hidden; }
  body.cargando #cargandoMsg {
    display:block; position:fixed; inset:0; text-align:center; padding-top:45vh;
    font-family:system-ui,sans-serif; color:#999; font-size:.95rem;
  }
</style>
</head>
<body class="cargando">
<div id="cargandoMsg">Cargando…</div>

<header>
  <h1 id="titulo"></h1>
  <p id="subtitulo"></p>
  <div class="linea"></div>
</header>

<div class="tabs">
  <button class="tab activa" id="tabShow">Presentación</button>
  <button class="tab" id="tabGrid">Ver todas</button>
</div>

<div class="escenario" id="escenario">
  <img id="imgA" alt="">
  <img id="imgB" alt="">
  <div class="vacio" id="vacio">Cargando…</div>
</div>

<div class="grilla" id="grilla"></div>

<div class="barra">
  <div id="aviso"></div>
  <button class="boton" id="btnSubir">Cargar tu foto</button>
  <input type="file" id="archivo" accept="image/*" multiple hidden>
</div>

<script>
  // ⚠️ Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbwVrL1XrR17noywGFM_BVImdZlKsdQp7N1A4ktIVc3hZRuA56TkEcbGHqF_oP1k0WfIVA/exec';

  var EVENTO = (new URLSearchParams(location.search).get('evento') || '').trim();
  var CONFIG = {};

  function $(id) { return document.getElementById(id); }

  // ---------- Comunicación con Apps Script ----------
  function apiGet(params) {
    return fetch(API_URL + '?' + new URLSearchParams(params).toString())
      .then(function (r) { return r.json(); });
  }
  function apiPost(obj) {
    // text/plain evita la comprobación previa (preflight) que Apps Script no admite
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(obj)
    }).then(function (r) { return r.json(); });
  }

  function errorFatal(texto) {
    document.body.classList.remove('cargando');
    document.querySelector('.tabs').style.display = 'none';
    document.querySelector('.barra').style.display = 'none';
    $('vacio').textContent = texto;
    $('vacio').style.display = 'flex';
  }

  // ---------- Estado ----------
  var fotos = [];
  var conocidas = {};
  var indice = 0;
  var capaActiva = 'A';
  var temporizador = null;
  var primeraCarga = true;

  function urlFoto(id, ancho) {
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + ancho;
  }

  // ---------- Personalización ----------
  function revelar() { document.body.classList.remove('cargando'); }
  function aplicarConfig(alTerminar) {
    var raiz = document.documentElement.style;
    if (CONFIG.colorPrincipal) raiz.setProperty('--principal', CONFIG.colorPrincipal);
    if (CONFIG.colorFondo) raiz.setProperty('--fondo', CONFIG.colorFondo);
    if (CONFIG.colorTexto) raiz.setProperty('--texto', CONFIG.colorTexto);
    $('titulo').textContent = CONFIG.titulo || '';
    $('subtitulo').textContent = CONFIG.subtitulo || '';
    document.title = CONFIG.titulo || 'Galería de fotos';

    var terminado = false;
    function fin() { if (terminado) return; terminado = true; if (alTerminar) alTerminar(); }
    setTimeout(fin, 1500); // si la letra tarda demasiado, se muestra igual
    
    if (CONFIG.fuente) { fin(); return; }
      raiz.setProperty('--fuente', "'" + CONFIG.fuente + "', Georgia, serif");
    var href = 'https://fonts.googleapis.com/css2?family=' + CONFIG.fuente.replace(/ /g, '+') + '&display=swap';
    var viejo = $('fuenteLink');
    if (viejo && viejo.getAttribute('href') === href) { fin(); return; }
    if (viejo) viejo.remove();
    var l = document.createElement('link');
    l.id = 'fuenteLink'; l.rel = 'stylesheet'; l.href = href;
    l.onload = function () {
      try { document.fonts.load("1em '" + CONFIG.fuente + "'").then(fin, fin); } catch (e) { fin(); }
    };
    l.onerror = fin;
    document.head.appendChild(l);
  }


  // ---------- Presentación ----------
  function mostrar(i) {
    if (!fotos.length) return;
    indice = ((i % fotos.length) + fotos.length) % fotos.length;
    var entrante = $(capaActiva === 'A' ? 'imgB' : 'imgA');
    var saliente = $(capaActiva === 'A' ? 'imgA' : 'imgB');
    var url = urlFoto(fotos[indice].id, 1600);
    var pre = new Image();
    pre.onload = function () {
      entrante.src = url;
      entrante.classList.add('visible');
      saliente.classList.remove('visible');
      capaActiva = capaActiva === 'A' ? 'B' : 'A';
    };
    pre.src = url;
    $('vacio').style.display = 'none';
  }

  function iniciarCiclo() {
    clearInterval(temporizador);
    temporizador = setInterval(function () {
      if (document.body.classList.contains('modo-grilla') || fotos.length < 2) return;
      mostrar(indice + 1);
    }, 5000);
  }

  // ---------- Grilla ----------
  function pintarGrilla() {
    var g = $('grilla');
    g.innerHTML = '';
    fotos.slice().reverse().forEach(function (f) {
      var im = document.createElement('img');
      im.loading = 'lazy';
      im.src = urlFoto(f.id, 400);
      im.onclick = function () {
        setModo('show');
        mostrar(fotos.findIndex(function (x) { return x.id === f.id; }));
      };
      g.appendChild(im);
    });
  }

  function setModo(m) {
    document.body.classList.toggle('modo-grilla', m === 'grid');
    $('tabShow').classList.toggle('activa', m === 'show');
    $('tabGrid').classList.toggle('activa', m === 'grid');
  }
  $('tabShow').onclick = function () { setModo('show'); };
  $('tabGrid').onclick = function () { setModo('grid'); };

  // ---------- Actualización en vivo ----------
  function recibirFotos(lista) {
    var hayNuevas = false;
    lista.forEach(function (f) { if (!conocidas[f.id]) { conocidas[f.id] = true; hayNuevas = true; } });
    if (!hayNuevas && !primeraCarga) return;

    fotos = lista;
    pintarGrilla();
    if (fotos.length) {
      mostrar(primeraCarga ? 0 : fotos.length - 1);
      iniciarCiclo();
    } else {
      $('vacio').textContent = 'Aún no hay fotos. ¡Sé la primera persona en subir una!';
      $('vacio').style.display = 'flex';
    }
    primeraCarga = false;
  }

  function consultar() {
    if (document.hidden) return;
    apiGet({ accion: 'fotos', evento: EVENTO })
      .then(function (r) {
        if (r && r.ok) recibirFotos(r.fotos);
        else if (primeraCarga) $('vacio').textContent = 'No se pudieron cargar las fotos.';
      })
      .catch(function () { /* se reintenta en el siguiente ciclo */ });
  }

  // ---------- Inicio ----------
  function iniciar() {
    if (!EVENTO) {
      errorFatal('Falta el código de la galería. Usa el enlace o el código QR que te compartieron.');
      return;
    }
     var guardada = null;
    try { guardada = JSON.parse(localStorage.getItem('cfg_' + EVENTO) || 'null'); } catch (e) { guardada = null; }
    if (guardada) { CONFIG = guardada; aplicarConfig(revelar); }

    apiGet({ accion: 'config', evento: EVENTO })
      .then(function (r) {
        if (!r || !r.ok) {
          errorFatal('No se encontró esta galería. Revisa el enlace o el código QR.');
          return;
        }
        var cambio = !guardada || JSON.stringify(r.config) !== JSON.stringify(guardada);
        CONFIG = r.config;
        try { localStorage.setItem('cfg_' + EVENTO, JSON.stringify(CONFIG)); } catch (e) {}
        if (cambio) aplicarConfig(revelar);
        consultar();
        setInterval(consultar, 8000);
      })
      .catch(function () {
        errorFatal('No se pudo cargar la galería. Revisa tu conexión e inténtalo de nuevo.');
      });
  }
  iniciar();

  // ---------- Subida de fotos ----------
  function aJpegBase64(archivo) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onload = function () {
        var max = 2000;
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
      img.src = url;
    });
  }

  function enviar(base64) {
    return apiPost({ accion: 'subir', evento: EVENTO, imagen: base64, mime: 'image/jpeg' })
      .then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || 'Error al subir');
        return r;
      });
  }

  var aviso = $('aviso');
  var btn = $('btnSubir');
  var input = $('archivo');

  btn.onclick = function () { input.click(); };
  input.onchange = async function () {
    var archivos = Array.prototype.slice.call(input.files);
    input.value = '';
    if (!archivos.length) return;

    btn.disabled = true;
    var subidas = 0, fallos = 0, moderada = false;
    for (var i = 0; i < archivos.length; i++) {
      aviso.textContent = 'Subiendo ' + (i + 1) + ' de ' + archivos.length + '…';
      try {
        var b64 = await aJpegBase64(archivos[i]);
        var r = await enviar(b64);
        if (r && r.moderada) moderada = true;
        subidas++;
      } catch (e) { fallos++; }
    }
    btn.disabled = false;

    if (subidas && !fallos) {
      aviso.textContent = moderada
        ? '¡Gracias! Tu foto aparecerá en la galería cuando sea aprobada.'
        : (CONFIG.mensajeGracias || '¡Gracias! Tu foto ya está en la galería.');
    } else if (subidas && fallos) {
      aviso.textContent = 'Se subieron ' + subidas + ' foto(s); ' + fallos + ' no se pudieron subir.';
    } else {
      aviso.textContent = 'No se pudo subir la foto. Inténtalo de nuevo.';
    }
    setTimeout(function () { aviso.textContent = ''; }, 6000);
    if (!moderada) setTimeout(consultar, 1500);
  };
</script>
</body>
</html>
